[package]
name = "rafka-rs"
version = "0.1.0"
edition = "2021"
description = "Rafka - A high-performance distributed message broker written in Rust"
license = "Apache-2.0"
repository = "https://github.com/Mahir101/Rafka"
keywords = ["message-broker", "distributed", "messaging", "p2p", "mesh"]
categories = ["network-programming"]
homepage = "https://github.com/Mahir101/Rafka"
documentation = "https://docs.rs/rafka-rs"
readme = "README.md"

# [[bin]]
# name = "start_producer"
# path = "src/bin/start_producer.rs"

# [[bin]]
# name = "start_consumer"
# path = "src/bin/start_consumer.rs"

# [[bin]]
# name = "start_broker"
# path = "src/bin/start_broker.rs"

# [[bin]]
# name = "benchmark"
# path = "src/bin/benchmark.rs"

# [[bin]]
# name = "metrics_server"
# path = "src/bin/metrics_server.rs"

[dependencies]
rafka-core = { path = "crates/core" }
rafka-broker = { path = "crates/broker" }
rafka-producer = { path = "crates/producer" }
rafka-consumer = { path = "crates/consumer" }
rafka-storage = { path = "crates/storage" }
rafka-streams = { path = "crates/streams" }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace]
members = [
    "crates/broker",
    "crates/core",
    "crates/producer",
    "crates/consumer",
    "crates/storage",
    "crates/streams"
]


