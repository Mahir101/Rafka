[package]
name = "rafka-streams"
version = "0.1.0"
edition = "2021"

[dependencies]
rafka-core = { path = "../core" }
rafka-consumer = { path = "../consumer" }
rafka-producer = { path = "../producer" }

tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
bytes = "1.5"
chrono = "0.4"
